# Qwen3.8 + LFM3 STT + Kokoro TTS variant: reasoning AND vision run on an external Anthropic-compatible
# server (LM Studio-style) on the HOST at port 1235, model qwen/qwen3.8-27b, via POST /v1/messages.
# No llama-server containers. Speech-to-text stays lfm3-audio; spoken replies come from kokoro-tts.
#
# Requirements: the server on the host must listen on 0.0.0.0:1235 (not only 127.0.0.1) so containers can reach it
# as host.docker.internal:1235, and the model must be loaded/loadable (first request may take ~1 min).
#
# Usage:
#   docker compose -f whatsap-qwen3.8-stt-tts-vision-compose.yml up --build
#
# First run needs an interactive terminal to scan the WhatsApp Web QR code for each configured device
# (see whatsap/devices/*/device.md):
#   docker compose -f whatsap-qwen3.8-stt-tts-vision-compose.yml run --rm whatsap
# The authenticated session then persists in ./whatsap/devices/<name>/session across restarts.
#
# `name:` gives this stack its own Compose project so it won't collide with other stacks.
name: agents-voice-whatsap-qwen38-stt-kokoro-vision

services:
  whatsap:
    build:
      context: .
      dockerfile: whatsap/Dockerfile
    image: agents-voice-whatsap:latest
    # Chromium (one per device) is slow/unstable with Docker's default 64MB.
    shm_size: "1gb"
    env_file:
      - ./.env.whatsap-llama
    volumes:
      # Per-device session, memory, scheduled tasks, and any file a device's
      # tools create/download (see lib/device-scoped-path.ts and
      # docs/superpowers/specs/2026-09-08-multi-device-support-design.md) —
      # devices/<name>/{session,memory,tasks,research,diagrams,ai-news,...}.
      # Every file-producing tool (write_file, download_file, web_search,
      # render_diagram, scheduled-task output, etc.) now resolves under a
      # device's own directory, so this one mount covers all of it — without
      # it, every image rebuild would wipe every device's auth session,
      # memory, schedules, and any files it created.
      - ./whatsap/devices:/app/devices
      # Device-onboarding drop directory (see whatsap/device-onboarding.ts)
      # — a new device is created by writing new-devices/<name>.md here;
      # the running process picks it up without a restart.
      - ./whatsap/new-devices:/app/new-devices
      # SQLite log of user messages, agent/sub-agent replies and tool results
      # (whatsap/lib/agent-logs.ts), kept on the host for later analysis.
      - ./logs:/data/logs
      # Sibling generate-posts project (web/generate-posts): the post-writer agent
      # queues prompts there and runs its post-with-image.js pipeline with the
      # project's own .env and node_modules (install them on the host first).
      - ../generate-posts:/data/generate-posts
    environment:
      AGENT_LOGS_DB: /data/logs/agent-logs.db
      # Model configurations managed in the UI (/models); read by id when a logged turn is replayed.
      MODEL_CONFIGS_DB: /data/logs/model-configs.db
      # External model server on the host (see header). The Anthropic SDK appends /v1/messages.
      ANTHROPIC_BASE_URL: ${QWEN_BASE_URL:-http://host.docker.internal:1235}
      ANTHROPIC_MODEL: ${QWEN_MODEL:-qwen/qwen3.8-27b}
      ANTHROPIC_API_KEY: ${QWEN_API_KEY:-not-needed}
      # Real name of the reasoning model, stored in each log row's "Reasoning Model" field.
      REASONING_MODEL_NAME: ${QWEN_MODEL:-qwen/qwen3.8-27b}
      GENERATE_POSTS_DIR: /data/generate-posts
      # Small local models can loop on web_search; fail fast instead of 100 steps.
      AGENT_RECURSION_LIMIT: "60"
      AGENT_TIMEZONE: ${AGENT_TIMEZONE:-America/Sao_Paulo}
      # Enables [trace] message-type logging and other debug tracing.
      NUXT_ADD_DEBUG_LOGS: "true"
      STT_URL: http://lfm3-audio:8010
      VOICE_REPLY: "true"
      TTS_URL: http://kokoro-tts:8020
      TTS_VOICE: female
      VIDEO_FRAMES: "6"
      # Turns that carry images/video frames go to the vision model (same server, /v1/messages);
      # all other text goes to the reasoning model. See lib/vision-routing.ts.
      VISION_BASE_URL: ${QWEN_BASE_URL:-http://host.docker.internal:1235}
      VISION_MODEL: ${QWEN_VISION_MODEL:-qwen/qwen3.8-27b}
      PLANTUML_URL: http://plantuml-renderer:3000
      # Comma-separated chat display names (as shown by "@ai list channels")
      # whose voice notes get transcribed and forwarded to the agent — see
      # index.ts. Audio sent to any other chat is left untouched.
      STT_ALLOWED_CHATS: "@jlabrada71,+55 48 8458-8841"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - lfm3-audio
      - kokoro-tts
      - plantuml-renderer
    # QR code login (first run) is printed to stdout and needs a TTY.
    stdin_open: true
    tty: true
    restart: unless-stopped

  ai-extension-server:
    build:
      context: .
      dockerfile: ai-extension/server/Dockerfile
    image: ai-extension-server:latest
    env_file:
      # Shared with whatsap; the ANTHROPIC_* values are overridden below to use the host model server.
      - ./.env.whatsap-llama
    ports:
      - "4100:4100"
    environment:
      ANTHROPIC_BASE_URL: ${QWEN_BASE_URL:-http://host.docker.internal:1235}
      ANTHROPIC_MODEL: ${QWEN_MODEL:-qwen/qwen3.8-27b}
      ANTHROPIC_API_KEY: ${QWEN_API_KEY:-not-needed}
      # Matches ai-extension/extension/manifest.config.ts's pinned dev key's
      # derived ID — see docs/user-guides/config.md. Override both together
      # if you swap in your own manifest key.
      EXTENSION_ID: kbemgcmgfjcmpfhfcpfgfpanaommfgco
      PORT: "4100"
      MAX_CONTEXT_CHARS: "20000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4100/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # One web app for the whatsap stack (same Nuxt app as the root `ui`):
  #   /connect  add WhatsApp devices, scan QR codes, reconnect (was `devices-ui`)
  #   /logs     read-only viewer for the agent log database
  # The TTS/STT page (/tts) needs backends this stack does not run.
  ui:
    build: ./ui
    image: agents-voice-ui:latest
    ports:
      - "3000:3000"
    environment:
      # NUXT_-prefixed so Nuxt's runtime override applies to the *built* image
      # (see ui/nuxt.config.ts). whatsap's internal API is reached by Docker
      # service-name DNS and never exposed to the host.
      NUXT_WHATSAP_API_URL: http://whatsap:4001
      NUXT_NEW_DEVICES_DIR: /data/new-devices
      NUXT_AGENT_LOGS_DB: /data/logs/agent-logs.db
      NUXT_MODEL_CONFIGS_DB: /data/logs/model-configs.db
    volumes:
      # Shared with whatsap's own ./whatsap/new-devices mount: the "Add Device"
      # form creates a device by writing a file here (whatsap/device-onboarding.ts).
      - ./whatsap/new-devices:/data/new-devices
      # Agent log database written by whatsap. Read-write because SQLite WAL
      # readers need the -shm file; the app itself opens it read-only.
      - ./logs:/data/logs
    depends_on:
      - whatsap
    restart: unless-stopped

  lfm3-audio:
    build: ./lfm3-audio
    image: lfm3-audio:latest
    ports:
      - "8010:8010"
    volumes:
      - ./models:/models
    environment:
      # Q4_K_M GGUF run via llama.cpp (see lfm3-audio/Dockerfile).
      LFM3_AUDIO_FILE: LFM3-Audio-2B-Q4_K_M.gguf
      LFM3_AUDIO_NGL: "99"
      NUXT_ADD_DEBUG_LOGS: "${NUXT_ADD_DEBUG_LOGS:-false}"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8010/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 300s
    restart: unless-stopped

  kokoro-tts:
    build: ./kokoro-tts
    image: kokoro-tts:latest
    ports:
      - "8020:8020"
    volumes:
      - ./models:/models
    environment:
      # Voices used for TTS_VOICE=female|male (English); other languages use the
      # per-language defaults in kokoro-tts/app.py. Any Kokoro voice id also works.
      KOKORO_VOICE_FEMALE: ${KOKORO_VOICE_FEMALE:-af_heart}
      KOKORO_VOICE_MALE: ${KOKORO_VOICE_MALE:-am_michael}
      KOKORO_SPEED: ${KOKORO_SPEED:-1.0}
      NUXT_ADD_DEBUG_LOGS: "${NUXT_ADD_DEBUG_LOGS:-false}"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8020/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s
    restart: unless-stopped

  plantuml-renderer:
    build: ./plantuml-renderer
    image: plantuml-renderer:latest
    ports:
      # Host port 3001 to avoid colliding with something else already using
      # 3000 on this host — internal service-to-service traffic (what
      # whatsap actually uses, via PLANTUML_URL) is on the container's own
      # port 3000 regardless, unaffected by this host-side mapping.
      - "3001:3000"
    environment:
      PORT: 3000
      PLANTUML_TIMEOUT_MS: 10000
      MAX_DIAGRAM_SIZE: 1048576
      MAX_CONCURRENT_RENDERS: 2
    # See plantuml-renderer/README.md's Security section for what these do.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
